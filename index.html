<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sensei FR • Official Links</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: "Inter", sans-serif;
    background: #000;
    color: #fff;
}


/* =========================================================
   BACKGROUND
========================================================= */

#background {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(255,255,255,0.085),
            transparent 25%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(255,255,255,0.045),
            transparent 35%
        ),
        linear-gradient(
            180deg,
            #010101 0%,
            #050505 45%,
            #000 100%
        );
}


/* Main glow */

#background::before {
    content: "";
    position: absolute;
    inset: -20%;

    background:
        radial-gradient(
            ellipse at 50% 30%,
            rgba(255,255,255,0.11),
            transparent 27%
        ),
        radial-gradient(
            ellipse at 15% 75%,
            rgba(255,255,255,0.035),
            transparent 25%
        ),
        radial-gradient(
            ellipse at 85% 70%,
            rgba(255,255,255,0.035),
            transparent 25%
        );

    filter: blur(35px);
    animation: backgroundPulse 8s ease-in-out infinite alternate;
}


/* Horizon light */

#background::after {
    content: "";
    position: absolute;

    left: 50%;
    top: 52%;

    width: 90%;
    height: 1px;

    transform: translateX(-50%);

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.18),
        transparent
    );

    box-shadow:
        0 0 25px rgba(255,255,255,0.12),
        0 0 70px rgba(255,255,255,0.05);
}


/* =========================================================
   FLOATING LIGHTS
========================================================= */

.orb {
    position: absolute;
    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,0.12),
            rgba(255,255,255,0.025) 35%,
            transparent 70%
        );

    filter: blur(5px);
    pointer-events: none;
}

.orb.one {
    width: 420px;
    height: 420px;

    left: -170px;
    top: 10%;

    animation: orbOne 14s ease-in-out infinite alternate;
}

.orb.two {
    width: 360px;
    height: 360px;

    right: -130px;
    top: 8%;

    animation: orbTwo 17s ease-in-out infinite alternate;
}

.orb.three {
    width: 500px;
    height: 500px;

    left: 50%;
    bottom: -380px;

    transform: translateX(-50%);

    opacity: .65;
}


/* =========================================================
   GRID
========================================================= */

.grid {
    position: absolute;
    inset: 0;

    background-image:
        linear-gradient(
            rgba(255,255,255,0.018) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,0.018) 1px,
            transparent 1px
        );

    background-size: 70px 70px;

    mask-image:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.7),
            transparent 75%
        );

    -webkit-mask-image:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.7),
            transparent 75%
        );

    opacity: .8;
}


/* =========================================================
   3D FLOOR
========================================================= */

.floor {
    position: absolute;

    left: -20%;
    bottom: -42%;

    width: 140%;
    height: 75%;

    transform:
        perspective(700px)
        rotateX(62deg);

    transform-origin: center top;

    background-image:
        linear-gradient(
            rgba(255,255,255,0.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,0.035) 1px,
            transparent 1px
        );

    background-size:
        65px 65px;

    mask-image:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.85),
            transparent 90%
        );

    -webkit-mask-image:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.85),
            transparent 90%
        );

    opacity: .65;
}


/* =========================================================
   VIGNETTE
========================================================= */

.vignette {
    position: fixed;
    inset: 0;

    z-index: 3;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 35%,
            rgba(0,0,0,.38) 72%,
            rgba(0,0,0,.82) 100%
        );
}


/* =========================================================
   NOISE
========================================================= */

.noise {
    position: fixed;
    inset: 0;

    z-index: 4;

    pointer-events: none;

    opacity: .035;

    background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
}


/* =========================================================
   MOUSE LIGHT
========================================================= */

#mouseLight {
    position: fixed;

    width: 420px;
    height: 420px;

    left: 0;
    top: 0;

    z-index: 5;

    pointer-events: none;

    transform: translate(-50%, -50%);

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.065),
            rgba(255,255,255,.02) 30%,
            transparent 70%
        );

    filter: blur(10px);

    opacity: .8;
}


/* =========================================================
   INTRO
========================================================= */

#intro {
    position: fixed;
    inset: 0;

    z-index: 100;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;

    background:
        radial-gradient(
            circle at center,
            rgba(255,255,255,.035),
            transparent 35%
        );

    transition:
        opacity .8s ease,
        visibility .8s ease;
}

#intro.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.intro-content {
    position: relative;

    text-align: center;

    padding: 50px 45px;

    max-width: 620px;
}

.intro-small {
    font-size: 11px;

    letter-spacing: 7px;

    color: rgba(255,255,255,.48);

    margin-bottom: 18px;

    animation: fadeUp .8s ease both;
}

.intro-title {
    font-size: clamp(58px, 12vw, 110px);

    line-height: .9;

    font-weight: 900;

    letter-spacing: -5px;

    background:
        linear-gradient(
            180deg,
            #fff 0%,
            #fff 35%,
            #d8d8d8 62%,
            #777 100%
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    filter:
        drop-shadow(0 0 30px rgba(255,255,255,.1));

    animation:
        introTitle .9s cubic-bezier(.2,.8,.2,1) both;
}

.intro-subtitle {
    margin-top: 22px;

    font-size: 12px;

    letter-spacing: 5px;

    color: rgba(255,255,255,.42);

    animation:
        fadeUp 1s .2s ease both;
}


/* ENTER BUTTON */

.enter-button {
    position: relative;

    margin-top: 42px;

    width: 190px;
    height: 55px;

    border: 1px solid rgba(255,255,255,.28);

    border-radius: 100px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.16),
            rgba(255,255,255,.045)
        );

    color: white;

    font-family: inherit;

    font-size: 11px;

    font-weight: 800;

    letter-spacing: 4px;

    cursor: pointer;

    overflow: hidden;

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    box-shadow:
        0 15px 45px rgba(0,0,0,.5),
        inset 0 1px 0 rgba(255,255,255,.22),
        0 0 30px rgba(255,255,255,.035);

    transition:
        transform .3s ease,
        background .3s ease,
        border-color .3s ease,
        box-shadow .3s ease;

    animation:
        fadeUp 1s .4s ease both;
}

.enter-button::before {
    content: "";

    position: absolute;

    left: -100%;
    top: 0;

    width: 70%;
    height: 100%;

    transform: skewX(-25deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.25),
            transparent
        );

    transition: left .7s ease;
}

.enter-button:hover::before {
    left: 140%;
}

.enter-button:hover {
    transform: translateY(-4px) scale(1.035);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.23),
            rgba(255,255,255,.07)
        );

    border-color: rgba(255,255,255,.5);

    box-shadow:
        0 20px 55px rgba(0,0,0,.6),
        0 0 35px rgba(255,255,255,.1),
        inset 0 1px 0 rgba(255,255,255,.3);
}


/* =========================================================
   MAIN
========================================================= */

#main {
    position: fixed;
    inset: 0;

    z-index: 10;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;

    opacity: 0;

    pointer-events: none;

    transform: scale(.98);

    transition:
        opacity .8s ease,
        transform .8s ease;
}

#main.show {
    opacity: 1;

    pointer-events: auto;

    transform: scale(1);
}


/* =========================================================
   CARD
========================================================= */

.card {
    position: relative;

    width: min(480px, 100%);

    max-height: calc(100vh - 40px);

    padding: 30px 26px 21px;

    overflow: hidden;

    border-radius: 30px;

    border: 1px solid rgba(255,255,255,.24);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.13) 0%,
            rgba(255,255,255,.075) 25%,
            rgba(255,255,255,.04) 55%,
            rgba(255,255,255,.075) 100%
        );

    backdrop-filter: blur(35px) saturate(130%);
    -webkit-backdrop-filter: blur(35px) saturate(130%);

    box-shadow:
        0 40px 120px rgba(0,0,0,.88),
        0 0 80px rgba(255,255,255,.055),
        0 0 30px rgba(255,255,255,.025),

        inset 0 1px 0 rgba(255,255,255,.35),
        inset 0 -1px 0 rgba(255,255,255,.05);

    transform-style: preserve-3d;

    transition:
        transform .12s ease-out,
        border-color .3s ease,
        box-shadow .3s ease;
}


/* Top shine */

.card::before {
    content: "";

    position: absolute;

    inset: 1px;

    border-radius: 29px;

    pointer-events: none;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.20),
            rgba(255,255,255,.055) 18%,
            transparent 42%,
            transparent 70%,
            rgba(255,255,255,.065)
        );

    opacity: .9;

    z-index: 0;
}


/* Outer glow */

.card::after {
    content: "";

    position: absolute;

    left: 50%;
    top: 0;

    width: 80%;
    height: 45%;

    transform: translateX(-50%);

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse,
            rgba(255,255,255,.11),
            transparent 70%
        );

    filter: blur(30px);

    pointer-events: none;

    z-index: 0;
}


/* Keep content above effects */

.card > * {
    position: relative;
    z-index: 2;
}


/* =========================================================
   LOGO
========================================================= */

.logo-button {
    width: 92px;
    height: 92px;

    margin: 0 auto 17px;

    padding: 0;

    display: block;

    border-radius: 50%;

    border: 1px solid rgba(255,255,255,.24);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.14),
            rgba(255,255,255,.035)
        );

    box-shadow:
        0 15px 40px rgba(0,0,0,.6),
        0 0 30px rgba(255,255,255,.04),
        inset 0 1px 0 rgba(255,255,255,.25);

    cursor: pointer;

    overflow: hidden;

    transition:
        transform .35s ease,
        box-shadow .35s ease,
        border-color .35s ease;
}

.logo-button:hover {
    transform:
        translateY(-5px)
        scale(1.05)
        rotate(2deg);

    border-color: rgba(255,255,255,.5);

    box-shadow:
        0 20px 55px rgba(0,0,0,.65),
        0 0 45px rgba(255,255,255,.1),
        inset 0 1px 0 rgba(255,255,255,.35);
}

.logo-button img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
}


/* =========================================================
   BRAND
========================================================= */

.brand {
    text-align: center;
}

.brand h1 {
    font-size: clamp(30px, 7vw, 42px);

    font-weight: 900;

    letter-spacing: 2px;

    line-height: 1;

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            #ffffff 32%,
            #d9d9d9 62%,
            #8a8a8a 100%
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    filter:
        drop-shadow(0 0 15px rgba(255,255,255,.12));
}

.brand p {
    margin-top: 7px;

    font-size: 9px;

    font-weight: 700;

    letter-spacing: 5px;

    color: rgba(255,255,255,.4);
}


/* =========================================================
   ANNOUNCEMENT
========================================================= */

.announcement {
    margin-top: 17px;

    padding: 11px 14px;

    text-align: center;

    border-radius: 14px;

    border: 1px solid rgba(255,255,255,.13);

    background:
        linear-gradient(
            100deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.035)
        );

    color: rgba(255,255,255,.78);

    font-size: 11px;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08);
}


/* =========================================================
   DESCRIPTION
========================================================= */

.description {
    margin-top: 10px;

    text-align: center;

    color: rgba(255,255,255,.38);

    font-size: 9px;

    letter-spacing: 2px;
}


/* =========================================================
   STATUS
========================================================= */

.status {
    margin: 15px auto 17px;

    width: fit-content;

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 7px 13px;

    border-radius: 100px;

    border: 1px solid rgba(255,255,255,.16);

    background:
        rgba(255,255,255,.065);

    color: rgba(255,255,255,.72);

    font-size: 9px;

    font-weight: 800;

    letter-spacing: 2px;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.1);
}

.status-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #777;

    box-shadow:
        0 0 10px currentColor;
}


/* =========================================================
   LINKS
========================================================= */

.links {
    display: flex;

    flex-direction: column;

    gap: 9px;
}

.link {
    position: relative;

    display: flex;

    align-items: center;

    width: 100%;

    min-height: 54px;

    padding: 6px 9px 6px 13px;

    text-decoration: none;

    color: #fff;

    border-radius: 16px;

    border: 1px solid rgba(255,255,255,.13);

    background:
        linear-gradient(
            100deg,
            rgba(255,255,255,.10),
            rgba(255,255,255,.042)
        );

    box-shadow:
        0 8px 22px rgba(0,0,0,.38),
        inset 0 1px 0 rgba(255,255,255,.1),
        inset 0 -1px 0 rgba(255,255,255,.025);

    overflow: hidden;

    transition:
        transform .25s ease,
        border-color .25s ease,
        background .25s ease,
        box-shadow .25s ease;
}

.link::before {
    content: "";

    position: absolute;

    left: -120%;
    top: 0;

    width: 65%;
    height: 100%;

    transform: skewX(-25deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.09),
            transparent
        );

    transition: left .6s ease;
}

.link:hover::before {
    left: 140%;
}

.link:hover {
    transform:
        translateY(-3px)
        scale(1.012);

    border-color: rgba(255,255,255,.3);

    background:
        linear-gradient(
            100deg,
            rgba(255,255,255,.16),
            rgba(255,255,255,.06)
        );

    box-shadow:
        0 15px 35px rgba(0,0,0,.48),
        0 0 25px rgba(255,255,255,.055),
        inset 0 1px 0 rgba(255,255,255,.18);
}


/* =========================================================
   ICON
========================================================= */

.icon {
    width: 40px;
    height: 40px;

    flex-shrink: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 12px;

    border: 1px solid rgba(255,255,255,.15);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.16),
            rgba(255,255,255,.04)
        );

    color: rgba(255,255,255,.95);

    font-size: 17px;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.15),
        0 0 15px rgba(255,255,255,.025);
}

.link-text {
    flex: 1;

    margin-left: 12px;

    font-size: 11px;

    font-weight: 700;

    letter-spacing: .5px;
}

.link-arrow {
    width: 30px;

    text-align: center;

    color: rgba(255,255,255,.28);

    font-size: 11px;

    transition:
        transform .25s ease,
        color .25s ease;
}

.link:hover .link-arrow {
    transform: translateX(4px);

    color: rgba(255,255,255,.8);
}


/* =========================================================
   FOOTER
========================================================= */

.footer {
    margin-top: 17px;

    text-align: center;

    color: rgba(255,255,255,.24);

    font-size: 8px;

    letter-spacing: 2px;
}


/* =========================================================
   PARTICLES
========================================================= */

.particle {
    position: fixed;

    width: 2px;
    height: 2px;

    border-radius: 50%;

    background: rgba(255,255,255,.6);

    pointer-events: none;

    z-index: 2;

    box-shadow:
        0 0 8px rgba(255,255,255,.35);

    animation:
        particleFloat linear infinite;
}


/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes backgroundPulse {
    from {
        transform: scale(1);
        opacity: .65;
    }

    to {
        transform: scale(1.08);
        opacity: 1;
    }
}

@keyframes orbOne {
    from {
        transform: translate(0,0);
    }

    to {
        transform: translate(120px,60px);
    }
}

@keyframes orbTwo {
    from {
        transform: translate(0,0);
    }

    to {
        transform: translate(-100px,80px);
    }
}

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes introTitle {
    from {
        opacity: 0;
        transform:
            translateY(30px)
            scale(.95);
        filter:
            blur(10px)
            drop-shadow(0 0 0 rgba(255,255,255,0));
    }

    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
        filter:
            blur(0)
            drop-shadow(0 0 30px rgba(255,255,255,.1));
    }
}

@keyframes particleFloat {
    from {
        transform:
            translateY(20px)
            translateX(0);
        opacity: 0;
    }

    20% {
        opacity: .7;
    }

    80% {
        opacity: .45;
    }

    to {
        transform:
            translateY(-100vh)
            translateX(40px);
        opacity: 0;
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 520px) {

    #main {
        padding: 12px;
    }

    .card {
        width: 100%;

        padding:
            23px
            17px
            16px;

        border-radius: 25px;
    }

    .logo-button {
        width: 76px;
        height: 76px;

        margin-bottom: 13px;
    }

    .brand h1 {
        font-size: 30px;
    }

    .announcement {
        margin-top: 13px;

        padding: 9px 10px;
    }

    .status {
        margin:
            11px
            auto
            12px;
    }

    .links {
        gap: 7px;
    }

    .link {
        min-height: 48px;
    }

    .icon {
        width: 36px;
        height: 36px;

        border-radius: 10px;

        font-size: 15px;
    }

    .link-text {
        margin-left: 9px;

        font-size: 10px;
    }

    .link-arrow {
        font-size: 9px;
    }

    .footer {
        margin-top: 12px;
    }

    .intro-content {
        padding: 30px 15px;
    }

    .intro-title {
        font-size: 65px;

        letter-spacing: -4px;
    }

    .intro-subtitle {
        font-size: 9px;

        letter-spacing: 3px;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     BACKGROUND
===================================================== -->

<div id="background">

    <div class="grid"></div>

    <div class="floor"></div>

    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>

</div>

<div class="vignette"></div>

<div class="noise"></div>

<div id="mouseLight"></div>


<!-- =====================================================
     INTRO
===================================================== -->

<section id="intro">

    <div class="intro-content">

        <div class="intro-small">
            WELCOME TO
        </div>

        <div class="intro-title">
            SENSEI
        </div>

        <div class="intro-subtitle">
            OFFICIAL LINKS
        </div>

        <button
            class="enter-button"
            id="enterButton"
        >
            ENTER
        </button>

    </div>

</section>


<!-- =====================================================
     MAIN
===================================================== -->

<main id="main">

    <div class="card" id="card">


        <!-- LOGO -->

        <button
            class="logo-button"
            id="logoButton"
            aria-label="Random Sensei FR link"
        >

            <img
                src="logo.png"
                alt="Sensei FR"
            >

        </button>


        <!-- BRAND -->

        <div class="brand">

            <h1>

<script>

/* =========================================================
   ELEMENTS
========================================================= */

const intro = document.getElementById("intro");
const main = document.getElementById("main");
const enterButton = document.getElementById("enterButton");

const card = document.getElementById("card");

const mouseLight = document.getElementById("mouseLight");

const statusText = document.getElementById("statusText");
const statusDot = document.getElementById("statusDot");

const logoButton = document.getElementById("logoButton");


/* =========================================================
   ENTER
========================================================= */

enterButton.addEventListener("click", () => {

    intro.classList.add("hidden");

    setTimeout(() => {
        main.classList.add("show");
    }, 180);

});


/* =========================================================
   MOUSE LIGHT
========================================================= */

document.addEventListener("mousemove", (event) => {

    mouseLight.style.left = event.clientX + "px";
    mouseLight.style.top = event.clientY + "px";

});


/* =========================================================
   3D CARD
========================================================= */

document.addEventListener("mousemove", (event) => {

    if (!main.classList.contains("show")) {
        return;
    }

    const rect = card.getBoundingClientRect();

    const x =
        event.clientX -
        rect.left -
        rect.width / 2;

    const y =
        event.clientY -
        rect.top -
        rect.height / 2;

    const rotateX =
        -(y / rect.height) * 4;

    const rotateY =
        (x / rect.width) * 4;

    card.style.transform =
        `perspective(1000px)
         rotateX(${rotateX}deg)
         rotateY(${rotateY}deg)
         translateY(-2px)`;

});


document.addEventListener("mouseleave", () => {

    card.style.transform =
        "perspective(1000px) rotateX(0deg) rotateY(0deg)";

});


/* =========================================================
   RANDOM LOGO LINK
========================================================= */

const randomLinks = [

    "https://www.youtube.com/@senseifr-livestream",

    "https://kick.com/sensei_fr",

    "https://www.instagram.com/yairfr12/",

    "https://discord.com/invite/Eqx7858MVn",

    "https://www.tiktok.com/@sense1_fr",

    "https://streamelements.com/sense1_fr/tip",

    "https://s-computers.com/"

];


logoButton.addEventListener("click", () => {

    const random =
        randomLinks[
            Math.floor(
                Math.random() *
                randomLinks.length
            )
        ];

    window.open(
        random,
        "_blank",
        "noopener,noreferrer"
    );

});


/* =========================================================
   KICK STATUS
========================================================= */

async function updateKickStatus() {

    try {

        const response = await fetch(
            "kick-status.json?t=" +
            Date.now(),
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error("Status file unavailable");
        }

        const data =
            await response.json();

        if (data.live === true) {

            statusText.textContent =
                "ONLINE";

            statusDot.style.background =
                "#ffffff";

            statusDot.style.color =
                "#ffffff";

            statusDot.style.boxShadow =
                "0 0 12px rgba(255,255,255,.9)";

        } else {

            statusText.textContent =
                "OFFLINE";

            statusDot.style.background =
                "#666";

            statusDot.style.color =
                "#777";

            statusDot.style.boxShadow =
                "0 0 8px rgba(255,255,255,.2)";

        }

    } catch (error) {

        statusText.textContent =
            "OFFLINE";

        statusDot.style.background =
            "#555";

        statusDot.style.color =
            "#555";

    }

}


/* Check immediately */

updateKickStatus();


/* Then every 15 seconds */

setInterval(
    updateKickStatus,
    15000
);


/* =========================================================
   PARTICLES
========================================================= */

function createParticle() {

    const particle =
        document.createElement("div");

    particle.className =
        "particle";

    particle.style.left =
        Math.random() * 100 + "%";

    particle.style.top =
        (70 + Math.random() * 30) + "%";

    particle.style.animationDuration =
        (8 + Math.random() * 14) + "s";

    particle.style.animationDelay =
        (Math.random() * 8) + "s";

    const size =
        1 + Math.random() * 2;

    particle.style.width =
        size + "px";

    particle.style.height =
        size + "px";

    document.body.appendChild(
        particle
    );

}


/* Create particles */

for (
    let i = 0;
    i < 35;
    i++
) {

    createParticle();

}


/* =========================================================
   BASIC PAGE PROTECTION
========================================================= */

document.addEventListener(
    "contextmenu",
    event => event.preventDefault()
);

document.addEventListener(
    "dragstart",
    event => event.preventDefault()
);

document.addEventListener(
    "selectstart",
    event => event.preventDefault()
);


document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "F12" ||

            (
                event.ctrlKey &&
                event.shiftKey &&
                ["I", "J", "C"].includes(
                    event.key.toUpperCase()
                )
            ) ||

            (
                event.ctrlKey &&
                ["U", "S"].includes(
                    event.key.toUpperCase()
                )
            )
        ) {

            event.preventDefault();

        }

    }
);
