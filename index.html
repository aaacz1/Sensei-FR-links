<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sensei FR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        min-width: 100%;
        min-height: 100%;
        overflow-x: hidden;
      }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        background: #080808;
        color: #fff;
        font-family: "Outfit", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow-y: auto;
      }
      .background {
        position: fixed;
        inset: 0;
        z-index: -2;
        background:
          radial-gradient(
            circle at 50% -10%,
            rgba(255, 255, 255, 0.15),
            transparent 30%
          ),
          radial-gradient(
            circle at 12% 25%,
            rgba(125, 125, 125, 0.16),
            transparent 27%
          ),
          radial-gradient(
            circle at 88% 82%,
            rgba(255, 255, 255, 0.07),
            transparent 30%
          ),
          linear-gradient(135deg, #181818, #080808 45%, #020202);
      }
      .background:after {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0.45;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
          linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.025) 1px,
            transparent 1px
          );
        background-size: 64px 64px;
        mask-image: radial-gradient(ellipse at center, #000, transparent 78%);
      }
      #particles {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: -1;
      }
      main {
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 24px;
        display: grid;
        place-items: center;
      }
      .card {
        width: min(100%, 540px);
        padding: 38px 38px 28px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 36px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.105),
          rgba(255, 255, 255, 0.028)
        );
        box-shadow:
          0 30px 90px rgba(0, 0, 0, 0.7),
          inset 0 1px 0 rgba(255, 255, 255, 0.16),
          inset 0 -1px 0 rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
        animation: enter 0.7s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .profile {
        text-align: center;
      }
      .avatar {
        position: relative;
        width: 104px;
        height: 104px;
        margin: 0 auto;
        display: grid;
        place-items: center;
      }
      .avatar:before {
        content: "";
        position: absolute;
        inset: -5px;
        border-radius: 50%;
        background: conic-gradient(#fff, #555, #111, #fff, #777, #fff);
        animation: spin 16s linear infinite;
        filter: drop-shadow(0 0 22px rgba(255, 255, 255, 0.24));
      }
      .avatar:after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: #070707;
      }
      .avatar img {
        position: relative;
        z-index: 1;
        width: calc(100% - 8px);
        height: calc(100% - 8px);
        object-fit: cover;
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        box-shadow:
          0 0 30px rgba(255, 255, 255, 0.16),
          0 12px 28px rgba(0, 0, 0, 0.5);
      }
      h1 {
        margin-top: 18px;
        font-size: clamp(32px, 5vw, 44px);
        font-weight: 700;
        letter-spacing: -1.5px;
        line-height: 1;
        background: linear-gradient(100deg, #fff, #aaa 45%, #f4f4f4 75%, #aaa);
        background-size: 180% auto;
        color: transparent;
        background-clip: text;
        -webkit-background-clip: text;
        animation: shine 6s linear infinite;
      }
      .description {
        margin: 12px 0 24px;
        color: rgba(255, 255, 255, 0.55);
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.7px;
      }
      .description span {
        color: rgba(255, 255, 255, 0.32);
        padding: 0 4px;
      }
      .links {
        display: grid;
        gap: 10px;
      }
      .link {
        position: relative;
        min-height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 11px;
        padding: 0 18px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        color: #fff;
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.065),
          rgba(255, 255, 255, 0.018)
        );
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.12),
          0 10px 22px rgba(0, 0, 0, 0.12);
        overflow: hidden;
        transition:
          transform 0.2s ease,
          border-color 0.2s ease,
          background 0.2s ease,
          box-shadow 0.2s ease;
      }
      .link:before {
        content: "";
        position: absolute;
        inset: 0;
        transform: translateX(-110%) skewX(-18deg);
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.16),
          transparent
        );
        transition: transform 0.55s ease;
      }
      .link:hover {
        transform: translateY(-2px);
        border-color: rgba(255, 255, 255, 0.22);
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.105),
          rgba(255, 255, 255, 0.03)
        );
        box-shadow:
          0 14px 28px rgba(0, 0, 0, 0.2),
          inset 0 1px 0 rgba(255, 255, 255, 0.18);
      }
      .link:hover:before {
        transform: translateX(210%) skewX(-18deg);
      }
      .link i {
        position: relative;
        width: 20px;
        color: #e2e2e2;
        font-size: 16px;
        text-align: center;
        transition: transform 0.2s ease;
      }
      .link:hover i {
        transform: translateY(-1px) scale(1.08);
      }
      .kick-link {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        padding: 0 14px;
      }
      .kick-link > span {
        position: relative;
        grid-column: 2;
      }
      .kick-logo {
        position: static;
        grid-column: 1;
        justify-self: start;
        width: 34px;
        height: 24px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(107, 255, 157, 0.55);
        border-radius: 7px;
        color: #caffdc;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: -0.4px;
        line-height: 1;
        background: linear-gradient(
          145deg,
          rgba(51, 255, 137, 0.24),
          rgba(15, 46, 28, 0.65)
        );
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.2),
          0 3px 10px rgba(0, 0, 0, 0.25);
      }
      .kick-status {
        position: static;
        grid-column: 3;
        justify-self: end;
        min-width: 63px;
        padding: 5px 8px;
        border-radius: 99px;
        font-size: 9px;
        line-height: 1;
        font-weight: 800;
        letter-spacing: 0.7px;
        text-align: center;
      }
      .kick-status.offline {
        color: rgba(255, 255, 255, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.035);
      }
      .kick-status.live {
        color: #eafff1;
        border: 1px solid rgba(82, 255, 149, 0.34);
        background: rgba(34, 255, 137, 0.12);
      }
      .kick-status.live:before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        margin-right: 5px;
        border-radius: 50%;
        background: #47ff8e;
        box-shadow: 0 0 9px #47ff8e;
        animation: pulse 1.2s infinite;
      }
      .gold {
        border-color: rgba(255, 208, 92, 0.35);
        background: linear-gradient(
          135deg,
          rgba(255, 196, 74, 0.13),
          rgba(255, 173, 44, 0.06),
          rgba(255, 255, 255, 0.025)
        );
        box-shadow:
          inset 0 1px 0 rgba(255, 244, 205, 0.18),
          0 8px 20px rgba(255, 184, 0, 0.06);
      }
      .gold:hover {
        border-color: rgba(255, 214, 110, 0.65);
        background: linear-gradient(
          135deg,
          rgba(255, 196, 74, 0.2),
          rgba(255, 173, 44, 0.1),
          rgba(255, 255, 255, 0.04)
        );
      }
      footer {
        margin-top: 15px;
        color: rgba(255, 255, 255, 0.28);
        font-size: 10px;
        letter-spacing: 0.8px;
      }
      @keyframes enter {
        from {
          opacity: 0;
          transform: translateY(22px) scale(0.97);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes shine {
        to {
          background-position: 180% center;
        }
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.45;
          transform: scale(0.8);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @media (max-width: 600px) {
        main {
          padding: 12px;
        }
        .card {
          padding: 26px 14px 20px;
          border-radius: 28px;
        }
        .avatar {
          width: 88px;
          height: 88px;
        }
        h1 {
          font-size: 34px;
        }
        .description {
          font-size: 11px;
          margin-bottom: 18px;
        }
        .link {
          min-height: 48px;
          font-size: 12px;
        }
        .kick-link {
          padding: 0 10px;
        }
        .kick-logo {
          width: 32px;
          height: 22px;
        }
        .kick-status {
          min-width: 56px;
          font-size: 8px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *:before,
        *:after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
      .background:before {
        content: "";
        position: absolute;
        inset: -18%;
        background:
          radial-gradient(
            circle at 50% 18%,
            rgba(255, 255, 255, 0.12),
            transparent 19%
          ),
          radial-gradient(
            circle at 35% 55%,
            rgba(255, 255, 255, 0.045),
            transparent 25%
          );
        filter: blur(34px);
        animation: ambient 20s ease-in-out infinite alternate;
      }
      .card {
        position: relative;
        overflow: hidden;
      }
      .card:before {
        content: "";
        position: absolute;
        top: -190px;
        left: 50%;
        width: 470px;
        height: 360px;
        transform: translateX(-50%);
        border-radius: 50%;
        background: radial-gradient(
          ellipse,
          rgba(255, 255, 255, 0.13),
          rgba(255, 255, 255, 0.035) 34%,
          transparent 70%
        );
        filter: blur(10px);
        pointer-events: none;
      }
      .profile {
        position: relative;
        z-index: 1;
      }
      .avatar {
        transform: scale(1.05);
        margin-bottom: 4px;
      }
      h1 {
        text-shadow: 0 8px 28px rgba(255, 255, 255, 0.08);
      }
      .description {
        margin-top: 14px;
        margin-bottom: 26px;
      }
      .links {
        gap: 11px;
      }
      .link {
        min-height: 54px;
        border-radius: 17px;
      }
      @keyframes ambient {
        from {
          transform: scale(1) translate3d(-1%, 0, 0);
        }
        to {
          transform: scale(1.08) translate3d(1%, 2%, 0);
        }
      }
    </style>
    <style>
      .card {
        animation-duration: 1.25s;
      }
      .avatar:before {
        animation-duration: 24s;
      }
      h1 {
        animation-duration: 10s;
      }
      .background:before {
        animation-duration: 20s;
      }
      .link {
        animation-duration: 1.05s;
      }
      .link:nth-child(1) {
        animation-delay: 0.16s;
      }
      .link:nth-child(2) {
        animation-delay: 0.28s;
      }
      .link:nth-child(3) {
        animation-delay: 0.4s;
      }
      .link:nth-child(4) {
        animation-delay: 0.52s;
      }
      .link:nth-child(5) {
        animation-delay: 0.64s;
      }
      .link:nth-child(6) {
        animation-delay: 0.76s;
      }
      .link:nth-child(7) {
        animation-delay: 0.88s;
      }
    </style>
    <style>
      .kick-link {
        display: flex;
        justify-content: center;
        padding: 0 18px;
      }
      .kick-link > span.kick-label {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        grid-column: auto;
        white-space: nowrap;
      }
      .kick-symbol {
        position: static !important;
        width: auto !important;
        color: #fff !important;
        font-size: 16px !important;
        transform: none !important;
      }
      .kick-link:hover .kick-label {
        transform: translateX(-50%);
      }
      .kick-link:hover .kick-symbol {
        transform: translateY(-1px) scale(1.08) !important;
      }
      .kick-status {
        position: absolute !important;
        right: 12px !important;
      }
      @media (max-width: 600px) {
        .kick-link {
          padding: 0 12px;
        }
        .kick-status {
          right: 9px !important;
        }
      }
      .card {
        width: min(100%, 560px);
        padding: 42px 40px 30px;
        border-color: rgba(255, 255, 255, 0.17);
        box-shadow:
          0 36px 100px rgba(0, 0, 0, 0.76),
          0 0 70px rgba(255, 255, 255, 0.025),
          inset 0 1px 0 rgba(255, 255, 255, 0.18),
          inset 0 -1px 0 rgba(255, 255, 255, 0.04);
      }
      .card:after {
        content: "";
        position: absolute;
        left: 12%;
        right: 12%;
        bottom: -180px;
        height: 260px;
        border-radius: 50%;
        background: radial-gradient(
          ellipse,
          rgba(255, 190, 72, 0.08),
          transparent 68%
        );
        filter: blur(18px);
        pointer-events: none;
      }
      .profile {
        position: relative;
        z-index: 1;
      }
      .avatar {
        width: 116px;
        height: 116px;
        transform: scale(1.04);
        margin-bottom: 6px;
      }
      h1 {
        font-size: clamp(35px, 5.4vw, 49px);
        text-shadow: 0 8px 28px rgba(255, 255, 255, 0.1);
      }
      .link {
        animation: linkEnter 1.05s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .link:nth-child(1) {
        animation-delay: 0.16s;
      }
      .link:nth-child(2) {
        animation-delay: 0.28s;
      }
      .link:nth-child(3) {
        animation-delay: 0.4s;
      }
      .link:nth-child(4) {
        animation-delay: 0.52s;
      }
      .link:nth-child(5) {
        animation-delay: 0.64s;
      }
      .link:nth-child(6) {
        animation-delay: 0.76s;
      }
      .link:nth-child(7) {
        animation-delay: 0.88s;
      }
      @keyframes linkEnter {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media (max-width: 600px) {
        .card {
          width: min(100%, 540px);
          padding: 26px 14px 20px;
        }
        .avatar {
          width: 88px;
          height: 88px;
        }
        h1 {
          font-size: 34px;
        }
      }
    </style>
  </head>
  <body>
    <div class="background" aria-hidden="true"></div>
    <canvas id="particles" aria-hidden="true"></canvas>
    <main>
      <section class="card" id="card">
        <div class="profile">
          <div class="avatar">
            <img src="logo.png" alt="Sensei FR" draggable="false" />
          </div>
          <h1>Sensei FR</h1>
          <p class="description">
            Creator <span>•</span> Streams <span>•</span> Community
          </p>
          <div class="links">
            <a
              class="link"
              href="https://www.youtube.com/@senseifr-livestream"
              target="_blank"
              rel="noopener noreferrer"
              ><i class="fas fa-video" aria-hidden="true"></i
              ><span>Clips Channel</span></a
            >
            <a
              class="link kick-link"
              href="https://kick.com/sensei_fr"
              target="_blank"
              rel="noopener noreferrer"
              ><span class="kick-label"
                ><i class="fas fa-bolt kick-symbol" aria-hidden="true"></i
                >Kick</span
              ><strong id="kick-status" class="kick-status offline"
                >OFFLINE</strong
              ></a
            >
            <a
              class="link"
              href="https://www.instagram.com/yairfr12/"
              target="_blank"
              rel="noopener noreferrer"
              ><i class="fab fa-instagram" aria-hidden="true"></i
              ><span>Instagram</span></a
            >
            <a
              class="link"
              href="https://discord.com/invite/Eqx7858MVn"
              target="_blank"
              rel="noopener noreferrer"
              ><i class="fab fa-discord" aria-hidden="true"></i
              ><span>Discord</span></a
            >
            <a
              class="link"
              href="https://www.tiktok.com/@sense1_fr"
              target="_blank"
              rel="noopener noreferrer"
              ><i class="fab fa-tiktok" aria-hidden="true"></i
              ><span>TikTok</span></a
            >
            <a
              class="link"
              href="https://streamelements.com/sense1_fr/tip"
              target="_blank"
              rel="noopener noreferrer"
              ><i class="fab fa-paypal" aria-hidden="true"></i
              ><span>Tip Sensei</span></a
            >
            <a
              class="link gold"
              href="https://s-computers.com/"
              target="_blank"
              rel="noopener noreferrer"
              ><i class="fas fa-desktop" aria-hidden="true"></i
              ><span>S מחשבים • Code SENSEI</span></a
            >
          </div>
          <footer>© Created by ZaDAV1D</footer>
        </div>
      </section>
    </main>
    <script>
      const card = document.getElementById("card"),
        canvas = document.getElementById("particles"),
        context = canvas.getContext("2d");
      let width = 0,
        height = 0,
        particles = [];
      function resizeCanvas() {
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * ratio;
        canvas.height = height * ratio;
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
      }
      function createParticles() {
        const amount = width < 600 ? 22 : 48;
        particles = Array.from({ length: amount }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.18,
          vy: (Math.random() - 0.5) * 0.18,
          size: Math.random() * 1.1 + 0.3,
        }));
      }
      function animate() {
        context.clearRect(0, 0, width, height);
        particles.forEach((p) => {
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < -5) p.x = width + 5;
          if (p.x > width + 5) p.x = -5;
          if (p.y < -5) p.y = height + 5;
          if (p.y > height + 5) p.y = -5;
          context.fillStyle = "rgba(255,255,255,.38)";
          context.beginPath();
          context.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          context.fill();
        });
        requestAnimationFrame(animate);
      }
      async function updateKickStatus() {
        const status = document.getElementById("kick-status");
        try {
          const response = await fetch("kick-status.json", {
              cache: "no-store",
            }),
            data = await response.json(),
            live = data.live === true;
          status.textContent = live ? "LIVE" : "OFFLINE";
          status.classList.toggle("live", live);
          status.classList.toggle("offline", !live);
        } catch (error) {
          status.textContent = "OFFLINE";
          status.classList.add("offline");
        }
      }
      if (window.matchMedia("(pointer:fine)").matches) {
        document.addEventListener("mousemove", (event) => {
          const x = (event.clientX / window.innerWidth - 0.5) * 3,
            y = (event.clientY / window.innerHeight - 0.5) * -3;
          card.style.transform = `rotateX(${y}deg) rotateY(${x}deg)`;
        });
        document.addEventListener("mouseleave", () => {
          card.style.transform = "rotateX(0deg) rotateY(0deg)";
        });
      }
      resizeCanvas();
      createParticles();
      animate();
      updateKickStatus();
      window.addEventListener("resize", () => {
        resizeCanvas();
        createParticles();
      });
    </script>
    <script>
      document.addEventListener("contextmenu", (event) => {
        if (!event.target.closest("a")) event.preventDefault();
      });

      document.addEventListener("selectstart", (event) => {
        if (!event.target.closest("a")) event.preventDefault();
      });

      document.addEventListener("dragstart", (event) => event.preventDefault());
      document.addEventListener("copy", (event) => event.preventDefault());
      document.addEventListener("cut", (event) => event.preventDefault());

      document.addEventListener("keydown", (event) => {
        const key = event.key.toLowerCase();
        const blockedShortcut =
          event.key === "F12" ||
          event.key === "F11" ||
          (event.ctrlKey && event.shiftKey && ["i", "j", "c"].includes(key)) ||
          (event.ctrlKey && ["u", "s", "c", "x"].includes(key));

        if (blockedShortcut) event.preventDefault();
      });
    </script>
  </body>
</html>
