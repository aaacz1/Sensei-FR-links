<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sensei FR</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    min-height:100vh;
    min-height:100dvh;

    font-family:"Space Grotesk",sans-serif;

    color:#fff;

    background:
        radial-gradient(
            circle at 50% -10%,
            #1b1b1b 0%,
            #090909 35%,
            #020202 75%
        );

    display:flex;
    align-items:center;
    justify-content:center;

    perspective:1200px;

    user-select:none;
    -webkit-user-select:none;
    -moz-user-select:none;
    -ms-user-select:none;

    -webkit-touch-callout:none;
}


/* =========================================================
   BACKGROUND
========================================================= */

.background{
    position:fixed;
    inset:0;

    overflow:hidden;

    pointer-events:none;

    z-index:0;
}

.background::before{
    content:"";

    position:absolute;
    inset:-20%;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(255,255,255,.12),
            transparent 28%
        ),
        radial-gradient(
            circle at 85% 75%,
            rgba(255,255,255,.075),
            transparent 32%
        ),
        radial-gradient(
            circle at 50% 50%,
            rgba(100,100,100,.10),
            transparent 42%
        );

    filter:blur(60px);

    animation:
        backgroundMove 15s ease-in-out infinite alternate;
}

.background::after{
    content:"";

    position:absolute;
    inset:0;

    background:
        linear-gradient(
            rgba(255,255,255,.018) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.018) 1px,
            transparent 1px
        );

    background-size:60px 60px;

    mask-image:
        radial-gradient(
            ellipse at center,
            black,
            transparent 78%
        );
}

@keyframes backgroundMove{

    from{
        transform:scale(1) rotate(0deg);
    }

    to{
        transform:scale(1.13) rotate(7deg);
    }

}


/* =========================================================
   PARTICLES
========================================================= */

#particles{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    pointer-events:none;

    z-index:1;
}


/* =========================================================
   MAIN
========================================================= */

main{
    position:relative;

    z-index:2;

    width:100%;
    height:100vh;
    height:100dvh;

    display:flex;

    justify-content:center;
    align-items:center;

    padding:
        clamp(8px,2vw,24px);
}


/* =========================================================
   CARD
========================================================= */

.card{

    position:relative;

    width:
        clamp(
            360px,
            42vw,
            590px
        );

    max-width:
        calc(100vw - 24px);

    max-height:
        calc(100dvh - 24px);

    padding:
        clamp(18px,3vh,34px)
        clamp(18px,3vw,36px)
        clamp(14px,2.5vh,24px);

    border-radius:
        clamp(22px,3vw,36px);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.105),
            rgba(255,255,255,.032)
        );

    border:
        1px solid
        rgba(255,255,255,.15);

    backdrop-filter:
        blur(35px)
        saturate(140%);

    -webkit-backdrop-filter:
        blur(35px)
        saturate(140%);

    box-shadow:
        0 35px 110px rgba(0,0,0,.72),
        inset 0 1px 0 rgba(255,255,255,.14),
        inset 0 -1px 0 rgba(255,255,255,.025),
        0 0 90px rgba(255,255,255,.04);

    overflow:hidden;

    transform-style:preserve-3d;

    animation:
        cardEnter .8s cubic-bezier(.16,1,.3,1);

    transition:
        transform .15s ease,
        box-shadow .3s ease;
}


/* top light */

.card::before{

    content:"";

    position:absolute;

    top:0;

    left:12%;
    right:12%;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.8),
            transparent
        );

    pointer-events:none;
}


/* inner glow */

.card::after{

    content:"";

    position:absolute;

    width:320px;
    height:200px;

    left:50%;
    top:-140px;

    transform:translateX(-50%);

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.10),
            transparent 70%
        );

    filter:blur(25px);

    pointer-events:none;
}


@keyframes cardEnter{

    from{

        opacity:0;

        transform:
            translateY(35px)
            scale(.94);
    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }

}


/* =========================================================
   PROFILE
========================================================= */

.profile{

    position:relative;

    z-index:2;

    width:100%;

    display:flex;

    flex-direction:column;

    align-items:center;
}


/* =========================================================
   LOGO
========================================================= */

.avatar{

    position:relative;

    width:
        clamp(
            76px,
            11vh,
            120px
        );

    height:
        clamp(
            76px,
            11vh,
            120px
        );

    display:flex;

    justify-content:center;
    align-items:center;

    flex-shrink:0;
}


/* rotating ring */

.avatar::before{

    content:"";

    position:absolute;

    inset:-5px;

    border-radius:50%;

    background:
        conic-gradient(
            from 0deg,
            #fff 0deg,
            #777 65deg,
            #111 140deg,
            #fff 225deg,
            #555 300deg,
            #fff 360deg
        );

    animation:
        logoSpin 8s linear infinite;

    filter:
        drop-shadow(
            0 0 20px
            rgba(255,255,255,.25)
        );
}


/* dark separator */

.avatar::after{

    content:"";

    position:absolute;

    inset:-1px;

    border-radius:50%;

    background:#070707;
}


/* actual logo */

.avatar img{

    position:relative;

    z-index:2;

    width:
        calc(100% - 8px);

    height:
        calc(100% - 8px);

    display:block;

    object-fit:cover;

    border-radius:50%;

    border:
        2px solid
        rgba(255,255,255,.18);

    box-shadow:
        0 0 30px rgba(255,255,255,.14),
        0 10px 30px rgba(0,0,0,.45);

    pointer-events:none;

    user-select:none;

    -webkit-user-drag:none;
}


@keyframes logoSpin{

    to{
        transform:rotate(360deg);
    }

}


/* =========================================================
   TITLE
========================================================= */

h1{

    margin-top:
        clamp(10px,1.8vh,18px);

    font-size:
        clamp(
            30px,
            4.5vw,
            48px
        );

    line-height:1;

    font-weight:700;

    letter-spacing:-2px;

    text-align:center;

    background:
        linear-gradient(
            90deg,
            #fff,
            #888,
            #fff
        );

    background-size:200% auto;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:
        titleShine 5s linear infinite;
}


@keyframes titleShine{

    to{
        background-position:200% center;
    }

}


/* =========================================================
   DESCRIPTION
========================================================= */

.description{

    margin-top:8px;

    margin-bottom:
        clamp(12px,2vh,22px);

    text-align:center;

    color:
        rgba(255,255,255,.50);

    font-size:
        clamp(
            10px,
            1.2vw,
            13px
        );

    font-weight:500;

    letter-spacing:.3px;
}


/* =========================================================
   LINKS
========================================================= */

.links{

    width:100%;

    display:flex;

    flex-direction:column;

    gap:
        clamp(
            5px,
            .9vh,
            9px
        );
}


.link{

    position:relative;

    width:100%;

    height:
        clamp(
            38px,
            6vh,
            52px
        );

    display:flex;

    align-items:center;

    justify-content:center;

    gap:11px;

    border-radius:
        clamp(
            11px,
            1.4vw,
            17px
        );

    color:#fff;

    text-decoration:none;

    font-size:
        clamp(
            11px,
            1.2vw,
            14px
        );

    font-weight:700;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.06),
            rgba(255,255,255,.018)
        );

    border:
        1px solid
        rgba(255,255,255,.09);

    overflow:hidden;

    pointer-events:auto;

    cursor:pointer;

    transition:
        transform .22s cubic-bezier(.16,1,.3,1),
        background .22s ease,
        border-color .22s ease,
        box-shadow .22s ease;
}


/* shine */

.link::before{

    content:"";

    position:absolute;

    top:0;
    left:-120%;

    width:60%;
    height:100%;

    transform:
        skewX(-20deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.18),
            transparent
        );

    transition:
        left .55s ease;
}

.link:hover::before{
    left:150%;
}

.link:hover{

    transform:
        translateY(-2px)
        scale(1.012);

    background:
        rgba(255,255,255,.085);

    border-color:
        rgba(255,255,255,.25);

    box-shadow:
        0 10px 28px rgba(0,0,0,.35),
        0 0 22px rgba(255,255,255,.05);
}


.link:active{
    transform:scale(.98);
}


.link i{

    width:20px;

    text-align:center;

    font-size:
        clamp(
            13px,
            1.4vw,
            17px
        );

    transition:
        transform .2s ease;
}


.link:hover i{
    transform:scale(1.15);
}


/* =========================================================
   GOLD BUTTON
========================================================= */

.gold{

    background:
        linear-gradient(
            135deg,
            rgba(255,193,7,.18),
            rgba(255,193,7,.035)
        );

    border-color:
        rgba(255,193,7,.38);
}


.gold:hover{

    background:
        linear-gradient(
            135deg,
            rgba(255,193,7,.26),
            rgba(255,255,255,.035)
        );

    border-color:
        rgba(255,211,70,.68);

    box-shadow:
        0 10px 32px
        rgba(255,193,7,.12);
}


/* =========================================================
   FOOTER
========================================================= */

.footer{

    margin-top:
        clamp(
            7px,
            1.3vh,
            13px
        );

    text-align:center;

    color:
        rgba(255,255,255,.22);

    font-size:
        clamp(
            8px,
            .8vw,
            10px
        );

    letter-spacing:.4px;
}


/* =========================================================
   LOADER
========================================================= */

#loader{

    position:fixed;

    inset:0;

    z-index:9999;

    display:flex;

    justify-content:center;
    align-items:center;

    background:
        radial-gradient(
            circle at center,
            #171717 0%,
            #060606 50%,
            #000 100%
        );

    transition:
        opacity .7s ease,
        visibility .7s ease;
}


#loader.hide{

    opacity:0;

    visibility:hidden;
}


.loader-content{

    position:relative;

    width:160px;
    height:160px;

    display:flex;

    justify-content:center;
    align-items:center;
}


.loader-logo{

    width:96px;
    height:96px;

    object-fit:cover;

    border-radius:50%;

    filter:
        drop-shadow(
            0 0 30px
            rgba(255,255,255,.55)
        );

    animation:
        loaderPulse 1.3s ease-in-out infinite alternate;

    pointer-events:none;
}


.loader-ring{

    position:absolute;

    width:145px;
    height:145px;

    border-radius:50%;

    border:
        2px solid
        rgba(255,255,255,.08);

    border-top-color:#fff;

    animation:
        loaderSpin 1.1s linear infinite;
}


.loader-ring-two{

    position:absolute;

    width:125px;
    height:125px;

    border-radius:50%;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-bottom-color:
        rgba(255,255,255,.75);

    animation:
        loaderSpinReverse 1.7s linear infinite;
}


@keyframes loaderSpin{

    to{
        transform:rotate(360deg);
    }

}


@keyframes loaderSpinReverse{

    to{
        transform:rotate(-360deg);
    }

}


@keyframes loaderPulse{

    from{
        transform:scale(.94);
    }

    to{
        transform:scale(1.06);
    }

}


/* =========================================================
   SHORT BROWSER
========================================================= */

@media(max-height:700px){

    .card{

        padding:
            14px
            24px
            12px;
    }

    .description{

        margin-bottom:9px;
    }

    .links{

        gap:4px;
    }

    .link{

        height:34px;
    }

    .footer{

        margin-top:6px;
    }

}


/* =========================================================
   VERY SHORT BROWSER
========================================================= */

@media(max-height:580px){

    .card{

        padding:
            8px
            18px
            8px;
    }

    .avatar{

        width:52px;
        height:52px;
    }

    h1{

        margin-top:5px;

        font-size:25px;
    }

    .description{

        display:none;
    }

    .links{

        gap:3px;
    }

    .link{

        height:27px;

        border-radius:9px;

        font-size:9px;
    }

    .link i{

        font-size:10px;
    }

    .footer{

        display:none;
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    main{

        padding:7px;
    }

    .card{

        width:
            calc(100vw - 14px);

        max-width:
            calc(100vw - 14px);

        padding:
            18px
            14px
            14px;

        border-radius:25px;
    }

    .avatar{

        width:82px;
        height:82px;
    }

    h1{

        font-size:34px;
    }

    .description{

        font-size:10px;

        margin-bottom:13px;
    }

    .link{

        height:42px;

        font-size:11px;
    }

}


/* =========================================================
   TOUCH
========================================================= */

@media(pointer:coarse){

    .link:hover{

        transform:none;
    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        animation-duration:.01ms !important;

        animation-iteration-count:1 !important;

        transition-duration:.01ms !important;
    }

}

</style>
</head>

<script>

/* =========================================================
   3D CARD
========================================================= */

const card =
    document.getElementById("card");

const canHover =
    window.matchMedia(
        "(pointer:fine)"
    ).matches;


if(canHover){

    document.addEventListener(
        "mousemove",
        (event) => {

            const x =
                (event.clientX /
                window.innerWidth - .5) * 5;

            const y =
                (event.clientY /
                window.innerHeight - .5) * -5;

            card.style.transform =
                `rotateX(${y}deg) rotateY(${x}deg)`;

        }
    );


    document.addEventListener(
        "mouseleave",
        () => {

            card.style.transform =
                "rotateX(0deg) rotateY(0deg)";

        }
    );

}


/* =========================================================
   PARTICLES
========================================================= */

const canvas =
    document.getElementById("particles");

const ctx =
    canvas.getContext("2d");

let width = 0;
let height = 0;

let particles = [];


function resizeCanvas(){

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    width =
        window.innerWidth;

    height =
        window.innerHeight;

    canvas.width =
        width * dpr;

    canvas.height =
        height * dpr;

    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}


function createParticles(){

    const amount =
        window.innerWidth < 600
            ? 25
            : 55;

    particles = [];

    for(
        let i = 0;
        i < amount;
        i++
    ){

        particles.push({

            x:
                Math.random() * width,

            y:
                Math.random() * height,

            vx:
                (Math.random() - .5)
                * .22,

            vy:
                (Math.random() - .5)
                * .22,

            size:
                Math.random()
                * 1.2 + .3

        });

    }

}


function animateParticles(){

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    for(
        let i = 0;
        i < particles.length;
        i++
    ){

        const a =
            particles[i];


        a.x += a.vx;
        a.y += a.vy;


        if(a.x < -5)
            a.x = width + 5;

        if(a.x > width + 5)
            a.x = -5;

        if(a.y < -5)
            a.y = height + 5;

        if(a.y > height + 5)
            a.y = -5;


        ctx.fillStyle =
            "rgba(255,255,255,.45)";

        ctx.beginPath();

        ctx.arc(
            a.x,
            a.y,
            a.size,
            0,
            Math.PI * 2
        );

        ctx.fill();


        for(
            let j = i + 1;
            j < particles.length;
            j++
        ){

            const b =
                particles[j];

            const dx =
                a.x - b.x;

            const dy =
                a.y - b.y;

            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if(distance < 90){

                const opacity =
                    (1 - distance / 90)
                    * .09;

                ctx.strokeStyle =
                    `rgba(255,255,255,${opacity})`;

                ctx.lineWidth = .5;

                ctx.beginPath();

                ctx.moveTo(
                    a.x,
                    a.y
                );

                ctx.lineTo(
                    b.x,
                    b.y
                );

                ctx.stroke();

            }

        }

    }


    requestAnimationFrame(
        animateParticles
    );

}


/* =========================================================
   START PARTICLES
========================================================= */

resizeCanvas();

createParticles();

animateParticles();


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        resizeCanvas();

        createParticles();

    }
);


/* =========================================================
   LOADER
========================================================= */

window.addEventListener(
    "load",
    () => {

        setTimeout(
            () => {

                document
                    .getElementById("loader")
                    .classList.add("hide");

            },
            1200
        );

    }
);


/* =========================================================
   DISABLE RIGHT CLICK
   EXCEPT ON LINKS
========================================================= */

document.addEventListener(
    "contextmenu",
    (event) => {

        if(
            !event.target.closest("a")
        ){

            event.preventDefault();

        }

    }
);


/* =========================================================
   DISABLE TEXT SELECTION
========================================================= */

document.addEventListener(
    "selectstart",
    (event) => {

        if(
            !event.target.closest("a")
        ){

            event.preventDefault();

        }

    }
);


/* =========================================================
   DISABLE DRAGGING
========================================================= */

document.addEventListener(
    "dragstart",
    (event) => {

        event.preventDefault();

    }
);


/* =========================================================
   DISABLE COPY
========================================================= */

document.addEventListener(
    "copy",
    (event) => {

        event.preventDefault();

    }
);


/* =========================================================
   DISABLE CUT
========================================================= */

document.addEventListener(
    "cut",
    (event) => {

        event.preventDefault();

    }
);


/* =========================================================
   KEYBOARD SHORTCUT PROTECTION
========================================================= */

document.addEventListener(
    "keydown",
    (event) => {

        const key =
            event.key.toLowerCase();


        /* F12 */

        if(
            event.key === "F12"
        ){

            event.preventDefault();

            return;

        }


        /* Ctrl + Shift + I */

        if(
            event.ctrlKey &&
            event.shiftKey &&
            key === "i"
        ){

            event.preventDefault();

            return;

        }


        /* Ctrl + Shift + J */

        if(
            event.ctrlKey &&
            event.shiftKey &&
            key === "j"
        ){

            event.preventDefault();

            return;

        }


        /* Ctrl + Shift + C */

        if(
            event.ctrlKey &&
            event.shiftKey &&
            key === "c"
        ){

            event.preventDefault();

            return;

        }


        /* Ctrl + U */

        if(
            event.ctrlKey &&
            key === "u"
        ){

            event.preventDefault();

            return;

        }


        /* Ctrl + S */

        if(
            event.ctrlKey &&
            key === "s"
        ){

            event.preventDefault();

            return;

        }


        /* Ctrl + C */

        if(
            event.ctrlKey &&
            key === "c"
        ){

            event.preventDefault();

            return;

        }


        /* Ctrl + X */

        if(
            event.ctrlKey &&
            key === "x"
        ){

            event.preventDefault();

            return;

        }

    }
);


/* =========================================================
   DISABLE MIDDLE / OTHER MOUSE BUTTONS
   OUTSIDE LINKS
========================================================= */

document.addEventListener(
    "mousedown",
    (event) => {

        const link =
            event.target.closest("a");

        if(
            !link &&
            event.button !== 0
        ){

            event.preventDefault();

        }

    }
);


/* =========================================================
   DISABLE AUX CLICK
========================================================= */

document.addEventListener(
    "auxclick",
    (event) => {

        if(
            event.target.closest("a")
        ){

            if(
                event.button !== 0
            ){

                event.preventDefault();

            }

        }

    }
);

</script>

</body>
</html>
