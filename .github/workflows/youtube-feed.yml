name: Refresh YouTube feed

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/youtube-feed.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch latest public channel feed
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const channelId = "UCppj1XG4Mj_TXCpeJWxs_Gg";
          const response = await fetch("https://www.youtube.com/feeds/videos.xml?channel_id=" + channelId, {
            headers: { accept: "application/atom+xml, application/xml" }
          });
          if (!response.ok) throw new Error("YouTube feed returned HTTP " + response.status);
          const xml = await response.text();
          const decode = (value) => value
            .replace(/^\s*<!\[CDATA\[([\s\S]*?)\]\]>\s*$/, "$1")
            .replace(/&#x([\da-f]+);/gi, (_, n) => String.fromCodePoint(parseInt(n, 16)))
            .replace(/&#(\d+);/g, (_, n) => String.fromCodePoint(Number(n)))
            .replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"')
            .replace(/&apos;/g, "'").replace(/&amp;/g, "&");
          const value = (entry, tag) => {
            const escaped = tag.replace(":", "\\s*:");
            const match = entry.match(new RegExp("<" + escaped + "\\b[^>]*>([\\s\\S]*?)</" + escaped + ">", "i"));
            return match ? decode(match[1]) : "";
          };
          const videos = [...xml.matchAll(/<entry\b[^>]*>([\s\S]*?)<\/entry>/gi)]
            .map(([, entry]) => {
              const id = value(entry, "yt:videoId");
              return id ? {
                id,
                title: value(entry, "title"),
                publishedAt: value(entry, "published"),
                thumbnail: "https://i.ytimg.com/vi/" + encodeURIComponent(id) + "/mqdefault.jpg"
              } : null;
            }).filter(Boolean).slice(0, 5);
          if (videos.length === 0) throw new Error("YouTube feed contained no videos; keeping previous cache.");
          const next = JSON.stringify({ status: "ok", videos }, null, 2) + "\n";
          let previous = "";
          try { previous = readFileSync("youtube.json", "utf8"); } catch {}
          if (previous !== next) writeFileSync("youtube.json", next);
          NODE
      - name: Commit changed feed
        run: |
          if git diff --quiet -- youtube.json; then
            echo "No new videos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube.json
          git commit -m "Update cached YouTube videos"
          git push
