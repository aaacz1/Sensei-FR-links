name: Update Kick Live Status

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-kick-status:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Kick status
        shell: bash
        run: |
          set -euo pipefail

          API_URL="https://kick.com/api/v2/channels/sensei_fr"

          RESPONSE=$(curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --max-time 20 \
            "$API_URL" \
            -H "Accept: application/json" \
            -H "User-Agent: Mozilla/5.0" \
            -H "Origin: https://kick.com" \
            -H "Referer: https://kick.com/")

          printf '%s' "$RESPONSE" > /tmp/kick-response.json

          python3 <<'PY'
          import json
          from pathlib import Path

          response = json.loads(Path('/tmp/kick-response.json').read_text())
          livestream = response.get('livestream')
          is_live = bool(isinstance(livestream, dict) and livestream.get('is_live') is True)

          Path('kick-status.json').write_text(
              json.dumps({'live': is_live}, indent=2) + '\n'
          )

          print('Kick live:', is_live)
          PY

      - name: Commit only when status changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add kick-status.json

          if git diff --cached --quiet; then
            echo "Kick status did not change."
            exit 0
          fi

          git commit -m "Update Kick live status"
          git push
