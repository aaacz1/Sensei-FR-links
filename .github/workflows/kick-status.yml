name: Kick live status
on:
  schedule:
    - cron: "2/5 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/kick-status.yml"
      - "functions/api/kick.js"
      - "index.html"
  workflow_dispatch:

permissions:
  statuses: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Kick channel
        id: check
        shell: bash
        run: |
          python3 <<'PY'
          import datetime
          import json
          import time
          import urllib.request

          checked_at = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          result = "UNAVAILABLE"
          stream_title = ""
          request = urllib.request.Request(
              "https://kick.com/api/v2/channels/sensei_fr",
              headers={
                  "Accept": "application/json",
                  "User-Agent": "Mozilla/5.0",
                  "Origin": "https://kick.com",
                  "Referer": "https://kick.com/",
              },
          )
          for attempt in range(3):
              try:
                  with urllib.request.urlopen(request, timeout=12) as response:
                      data = json.load(response)
                  if not isinstance(data, dict) or "livestream" not in data:
                      raise ValueError("Unexpected Kick response")
                  stream = data["livestream"]
                  if stream is not None and (
                      not isinstance(stream, dict) or not isinstance(stream.get("is_live"), bool)
                  ):
                      raise ValueError("Unexpected livestream response")
                  result = "LIVE" if stream and stream.get("is_live") is True else "OFFLINE"
                  if result == "LIVE":
                      stream_title = str(stream.get("session_title") or stream.get("title") or "").replace("|", " ").strip()
                      stream_title = " ".join(stream_title.split())[:90]
                  else:
                      stream_title = ""
                  break
              except Exception as error:
                  print(f"Kick request attempt {attempt + 1} failed: {error}")
                  if attempt < 2:
                      time.sleep(2 * (attempt + 1))

          description = f"{result}|{checked_at}" + (f"|{stream_title}" if stream_title else "")
          with open("/tmp/kick-status.txt", "w", encoding="utf-8") as output:
              output.write(description)
          print(f"Publishing {result} checked at {checked_at}")
          PY
      - name: Publish commit status
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          DESCRIPTION="$(cat /tmp/kick-status.txt)"
          RESULT="${DESCRIPTION%%|*}"
          if [ "$RESULT" = "UNAVAILABLE" ]; then
            STATE="failure"
          else
            STATE="success"
          fi
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="kick/live-status" \
            -f description="$DESCRIPTION" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
