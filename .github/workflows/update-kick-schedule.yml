name: Update Kick Schedule

on:
  schedule:
    - cron: "5 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install schedule browser
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix .github/scripts --no-fund --no-audit
          npx --prefix .github/scripts playwright install --with-deps chromium

      - name: Refresh schedule for the current Israel week
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/update-schedule.mjs

      - name: Commit schedule when it changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add schedule.json

          if git diff --cached --quiet; then
            echo "Schedule did not change."
            exit 0
          fi

          git commit -m "Update Kick schedule"
          git push
